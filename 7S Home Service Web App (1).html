          {/* CART & CHECKOUT DRAWER */}
          {isCartOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex justify-end">
              <div className="w-full max-w-md bg-slate-900 h-full overflow-y-auto p-6 border-l border-slate-800 flex flex-col justify-between shadow-2xl">
                <div>
                  <div className="flex items-center justify-between pb-4 border-b border-slate-800 mb-4">
                    <h3 className="text-lg font-black text-white flex items-center gap-2">
                      <ShoppingBagIcon /> Your Cart ({cart.reduce((a, c) => a + c.quantity, 0)})
                    </h3>
                    <button
                      onClick={() => setIsCartOpen(false)}
                      className="text-slate-400 hover:text-white text-lg font-bold"
                    >
                      ✕
                    </button>
                  </div>

                  {cart.length === 0 ? (
                    <div className="text-center py-12 text-slate-400 text-xs">
                      Your cart is empty. Add services from the catalog!
                    </div>
                  ) : (
                    <div className="space-y-4 mb-6">
                      {cart.map((item, idx) => (
                        <div key={idx} className="bg-slate-950 p-3.5 rounded-2xl border border-slate-800 flex items-center justify-between gap-3">
                          <div className="flex-1">
                            <h5 className="font-extrabold text-xs text-white">{item.name}</h5>
                            <span className="text-emerald-400 font-bold text-xs">₹{item.price} each</span>
                            <span className="text-[10px] text-amber-400 font-bold block mt-0.5">Saman (Parts) Extra</span>
                          </div>

                          <div className="flex items-center gap-2 bg-slate-900 border border-slate-700 px-2 py-1 rounded-xl">
                            <button
                              onClick={() => updateQuantity(item.id, -1, item.name)}
                              className="text-slate-400 hover:text-white font-bold px-1.5 text-xs"
                            >
                              -
                            </button>
                            <span className="text-xs font-black text-white px-1">{item.quantity}</span>
                            <button
                              onClick={() => updateQuantity(item.id, 1, item.name)}
                              className="text-slate-400 hover:text-white font-bold px-1.5 text-xs"
                            >
                              +
                            </button>
                          </div>
                        </div>
                      ))}

                      {/* Explicit Saman Note in Cart */}
                      <div className="bg-amber-500/10 border border-amber-500/30 rounded-2xl p-3 text-[11px] text-amber-200 leading-relaxed font-medium flex items-start gap-2">
                        <ExclamationTriangleIcon />
                        <div>
                          <strong className="text-amber-300 font-extrabold block">Spare Parts / Saman Policy:</strong>
                          Your bill covers labor and doorstep service inspection. If replacement hardware, switches, pipes, or spare parts (saman) are required during work, they will be billed separately with genuine invoice.
                        </div>
                      </div>

                      {/* Promo Coupons */}
                      <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3">
                        <span className="text-xs font-bold text-slate-300 block">Apply Discount Coupon</span>
                        <div className="flex gap-2">
                          <input
                            type="text"
                            placeholder="Enter Code (e.g. PEST20)"
                            value={promoCode}
                            onChange={(e) => setPromoCode(e.target.value)}
                            className="bg-slate-900 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-white uppercase focus:outline-none flex-1 font-mono"
                          />
                          <button
                            onClick={() => handleApplyCoupon()}
                            className="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs px-3 py-1.5 rounded-xl"
                          >
                            Apply
                          </button>
                        </div>
                        {couponError && <p className="text-[10px] text-rose-400 font-bold">{couponError}</p>}

                        <div className="flex flex-wrap gap-1.5 pt-1">
                          {PROMO_OFFERS.map((po, i) => (
                            <button
                              key={i}
                              onClick={() => handleApplyCoupon(po.code)}
                              className="text-[10px] bg-slate-900 hover:bg-slate-800 border border-slate-700 text-emerald-300 px-2 py-1 rounded-lg font-mono font-bold"
                            >
                              {po.code}
                            </button>
                          ))}
                        </div>
                      </div>

                      {/* Slot Selection */}
                      <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-3">
                        <span className="text-xs font-bold text-slate-300 block">Select Date & Time Slot</span>
                        <div className="grid grid-cols-3 gap-2">
                          {['Today', 'Tomorrow', 'Day After'].map((d) => (
                            <button
                              key={d}
                              onClick={() => setSelectedDate(d)}
                              className={`py-1.5 rounded-xl text-xs font-bold border ${
                                selectedDate === d ? 'bg-emerald-500 text-slate-950 border-emerald-400' : 'bg-slate-900 border-slate-800 text-slate-400'
                              }`}
                            >
                              {d}
                            </button>
                          ))}
                        </div>

                        <select
                          value={selectedSlot}
                          onChange={(e) => setSelectedSlot(e.target.value)}
                          className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white font-bold focus:outline-none"
                        >
                          <option value="10:00 AM - 11:00 AM">10:00 AM - 11:00 AM</option>
                          <option value="02:00 PM - 03:00 PM">02:00 PM - 03:00 PM</option>
                          <option value="05:00 PM - 06:00 PM">05:00 PM - 06:00 PM</option>
                          <option value="07:00 PM - 08:00 PM">07:00 PM - 08:00 PM</option>
                        </select>
                      </div>

                      {/* Order Summary */}
                      <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 space-y-2 text-xs">
                        <div className="flex justify-between text-slate-400">
                          <span>Labor Items Subtotal</span>
                          <span>₹{rawSubtotal}</span>
                        </div>
                        {isUcPlus && (
                          <div className="flex justify-between text-amber-300 font-semibold">
                            <span>7S Plus 10% Discount</span>
                            <span>-₹{ucPlusDiscount}</span>
                          </div>
                        )}
                        {appliedDiscount > 0 && (
                          <div className="flex justify-between text-emerald-400 font-semibold">
                            <span>Promo Discount</span>
                            <span>-₹{appliedDiscount}</span>
                          </div>
                        )}
                        <div className="flex justify-between text-slate-400">
                          <span>Doorstep Convenience & Visit Safety Fee</span>
                          <span>₹{convenienceFee}</span>
                        </div>
                        <div className="flex justify-between text-slate-400">
                          <span>Taxes & Service Charge (5%)</span>
                          <span>₹{taxes}</span>
                        </div>
                        <div className="flex justify-between text-amber-400 font-bold border-t border-slate-800/80 pt-2 text-[11px]">
                          <span>Spare Parts / Materials (Saman)</span>
                          <span>Extra as per MRP</span>
                        </div>
                        <div className="border-t border-slate-800 pt-2 flex justify-between font-black text-sm text-white">
                          <span>Total Payable Now</span>
                          <span className="text-emerald-400">₹{grandTotal}</span>
                        </div>
                      </div>
                    </div>
                  )}
                </div>

                {cart.length > 0 && (
                  <button
                    onClick={handleCheckout}
                    className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3.5 rounded-2xl shadow-xl shadow-emerald-500/20 text-sm transition transform active:scale-95 mt-4"
                  >
                    Confirm & Schedule Service (₹{grandTotal})
                  </button>
                )}
              </div>
            </div>
          )}

          {/* SQUARE FOOT ESTIMATOR MODAL */}
          {isPestEstimatorOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 max-w-lg w-full rounded-3xl p-6 shadow-2xl relative">
                <button
                  onClick={() => setIsPestEstimatorOpen(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-white font-bold"
                >
                  ✕
                </button>

                <h3 className="text-xl font-black text-white mb-1 flex items-center gap-2">
                  <RulerIcon /> Square-Foot Rate Calculator
                </h3>
                <p className="text-slate-400 text-xs mb-6">Calculate customized quotes based on carpet area</p>

                <div className="space-y-4 mb-6">
                  <div>
                    <label className="text-xs font-bold text-slate-300 block mb-1">Service Type</label>
                    <select
                      value={estimatorPestType}
                      onChange={(e) => setEstimatorPestType(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white font-bold"
                    >
                      <option value="Cockroaches & Ants">Pest Control - Cockroaches & Ants (₹1.8/sq ft)</option>
                      <option value="Termites">Anti-Termite Treatment (₹5.0/sq ft)</option>
                      <option value="Bed Bugs">Bed Bug Eradication (₹3.0/sq ft)</option>
                      <option value="Mosquitoes & Viruses">Deep Cleaning & Sanitization (₹5.0/sq ft)</option>
                    </select>
                  </div>

                  <div>
                    <div className="flex justify-between text-xs font-bold text-slate-300 mb-1">
                      <span>Home Carpet Area:</span>
                      <span className="text-emerald-400 font-black">{estimatorSqFt} sq. ft.</span>
                    </div>
                    <input
                      type="range"
                      min="400"
                      max="4000"
                      step="50"
                      value={estimatorSqFt}
                      onChange={(e) => setEstimatorSqFt(Number(e.target.value))}
                      className="w-full accent-emerald-500 cursor-pointer"
                    />
                  </div>

                  <div>
                    <label className="text-xs font-bold text-slate-300 block mb-1">Infestation / Cleaning Depth</label>
                    <div className="grid grid-cols-3 gap-2">
                      {['Mild', 'Moderate', 'Severe'].map((sev) => (
                        <button
                          key={sev}
                          onClick={() => setEstimatorSeverity(sev)}
                          className={`py-2 rounded-xl text-xs font-bold border ${
                            estimatorSeverity === sev ? 'bg-emerald-500 text-slate-950 border-emerald-400' : 'bg-slate-950 border-slate-800 text-slate-400'
                          }`}
                        >
                          {sev}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 text-center">
                    <span className="text-xs text-slate-400 block mb-1">Calculated Package Cost</span>
                    <span className="text-2xl font-black text-emerald-400">₹{estimatedPestPrice}</span>
                  </div>
                </div>

                <button
                  onClick={() => {
                    const matchedService = INITIAL_SERVICES.find(s => s.categoryId === 'pest_control') || INITIAL_SERVICES[0];
                    addToCart(matchedService, estimatorSqFt, estimatedPestPrice);
                    setIsPestEstimatorOpen(false);
                  }}
                  className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3 rounded-xl text-xs shadow-lg shadow-emerald-500/20"
                >
                  Add Custom Package to Cart
                </button>
              </div>
            </div>
          )}

          {/* AI DIAGNOSIS MODAL */}
          {isAiModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 max-w-lg w-full rounded-3xl p-6 shadow-2xl relative">
                <button
                  onClick={() => setIsAiModalOpen(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-white font-bold"
                >
                  ✕
                </button>

                <h3 className="text-xl font-black text-white mb-1 flex items-center gap-2">
                  <RobotIcon /> 7S AI Smart Home Assistant
                </h3>
                <p className="text-slate-400 text-xs mb-4">Describe any household fault (short circuit, tap leak, washing machine noise, gas stove flame) for diagnostic advice</p>

                <form onSubmit={handleAiDiagnosis} className="space-y-4 mb-4">
                  <textarea
                    rows="3"
                    placeholder="e.g. My washing machine is making loud spinning noises or my switchboard sparked..."
                    value={aiPrompt}
                    onChange={(e) => setAiPrompt(e.target.value)}
                    className="w-full bg-slate-950 border border-slate-700 rounded-2xl p-3 text-xs text-white placeholder-slate-500 focus:outline-none"
                  ></textarea>

                  <button
                    type="submit"
                    disabled={aiLoading}
                    className="w-full bg-gradient-to-r from-emerald-500 to-teal-500 text-slate-950 font-black py-2.5 rounded-xl text-xs flex items-center justify-center gap-2"
                  >
                    {aiLoading ? 'Diagnosing with AI...' : 'Diagnose Problem'}
                  </button>
                </form>

                {aiResponse && (
                  <div className="bg-slate-950 p-4 rounded-2xl border border-slate-800 text-xs text-slate-200 leading-relaxed whitespace-pre-line max-h-60 overflow-y-auto">
                    {aiResponse}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* SERVICE DETAIL MODAL */}
          {selectedServiceDetail && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 max-w-lg w-full rounded-3xl p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
                <button
                  onClick={() => setSelectedServiceDetail(null)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-white font-bold"
                >
                  ✕
                </button>

                <img src={selectedServiceDetail.image} alt={selectedServiceDetail.name} className="w-full h-48 object-cover rounded-2xl mb-4" />

                <h3 className="text-lg font-black text-white mb-1">{selectedServiceDetail.name}</h3>
                <span className="text-emerald-400 font-black text-lg block mb-2">₹{selectedServiceDetail.price} (+ ₹{selectedServiceDetail.visitCharge} Visit Fee)</span>

                {/* Clear Saman Disclaimer Box */}
                <div className="bg-amber-500/10 border border-amber-500/40 rounded-2xl p-3 mb-4 text-xs text-amber-300 flex items-start gap-2">
                  <ExclamationTriangleIcon />
                  <div>
                    <strong className="text-amber-200 font-extrabold block">Saman / Materials Policy:</strong>
                    Base labor, inspection, and diagnosis fee is included in this price. Any hardware replacement, spare parts, switches, taps, or copper piping (saman) are NOT included and will be billed separately as per actual usage.
                  </div>
                </div>

                <div className="space-y-4 text-xs mb-6">
                  <div>
                    <h5 className="font-extrabold text-slate-300 mb-1">Description</h5>
                    <p className="text-slate-400 leading-relaxed">{selectedServiceDetail.description}</p>
                  </div>

                  <div>
                    <h5 className="font-extrabold text-emerald-400 mb-1">What Is Included</h5>
                    <ul className="list-disc list-inside text-slate-300 space-y-1">
                      {selectedServiceDetail.inclusions.map((inc, i) => (
                        <li key={i}>{inc}</li>
                      ))}
                    </ul>
                  </div>

                  <div>
                    <h5 className="font-extrabold text-rose-400 mb-1">What Is Excluded (Saman & Hardware)</h5>
                    <ul className="list-disc list-inside text-slate-400 space-y-1">
                      {selectedServiceDetail.exclusions.map((exc, i) => (
                        <li key={i}>{exc}</li>
                      ))}
                    </ul>
                  </div>

                  {selectedServiceDetail.faqs && (
                    <div>
                      <h5 className="font-extrabold text-amber-300 mb-1">Frequently Asked Questions</h5>
                      <div className="space-y-2">
                        {selectedServiceDetail.faqs.map((f, fi) => (
                          <div key={fi} className="bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                            <strong className="text-white block mb-0.5">{f.q}</strong>
                            <p className="text-slate-400">{f.a}</p>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </div>

                <button
                  onClick={() => {
                    addToCart(selectedServiceDetail);
                    setSelectedServiceDetail(null);
                  }}
                  className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3 rounded-xl text-xs shadow-lg shadow-emerald-500/20"
                >
                  Add to Cart
                </button>
              </div>
            </div>
          )}

          {/* LOCATION SELECTOR MODAL */}
          {isLocationModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-800 max-w-sm w-full rounded-3xl p-6 shadow-2xl relative">
                <button
                  onClick={() => setIsLocationModalOpen(false)}
                  className="absolute top-4 right-4 text-slate-400 hover:text-white font-bold"
                >
                  ✕
                </button>

                <h3 className="text-lg font-black text-white mb-4">Select Service City</h3>

                <div className="space-y-3 mb-6">
                  <div>
                    <label className="text-xs text-slate-400 font-bold block mb-1">Popular Cities</label>
                    <select
                      value={selectedCity}
                      onChange={(e) => setSelectedCity(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white font-bold"
                    >
                      {POPULAR_CITIES.map((c) => (
                        <option key={c} value={c}>{c}</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="text-xs text-slate-400 font-bold block mb-1">Address / Society Name</label>
                    <input
                      type="text"
                      value={addressLine}
                      onChange={(e) => setAddressLine(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white font-semibold"
                    />
                  </div>
                </div>

                <button
                  onClick={() => setIsLocationModalOpen(false)}
                  className="w-full bg-emerald-500 text-slate-950 font-black py-2.5 rounded-xl text-xs"
                >
                  Save Location
                </button>
              </div>
            </div>
          )}

          {/* MOBILE BOTTOM NAVIGATION BAR */}
          <nav className="sm:hidden fixed bottom-0 left-0 right-0 z-40 bg-slate-900/95 backdrop-blur-md border-t border-slate-800 px-4 py-2.5 flex items-center justify-around text-center">
            <button
              onClick={() => setActiveTab('customer')}
              className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${
                activeTab === 'customer' ? 'text-emerald-400' : 'text-slate-400'
              }`}
            >
              <span className="text-base">✨</span>
              <span>Services</span>
            </button>

            <button
              onClick={() => setActiveTab('wishlist')}
              className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${
                activeTab === 'wishlist' ? 'text-emerald-400' : 'text-slate-400'
              }`}
            >
              <span className="text-base">❤️</span>
              <span>Saved ({wishlist.length})</span>
            </button>

            <button
              onClick={() => setActiveTab('bookings')}
              className={`flex flex-col items-center gap-0.5 text-[10px] font-bold ${
                activeTab === 'bookings' ? 'text-emerald-400' : 'text-slate-400'
              }`}
            >
              <span className="text-base">📋</span>
              <span>Bookings ({bookings.length})</span>
            </button>

            <button
              onClick={() => setIsCartOpen(true)}
              className="flex flex-col items-center gap-0.5 text-[10px] font-bold text-emerald-400"
            >
              <span className="text-base">🛍️</span>
              <span>Cart ({cart.reduce((a, c) => a + c.quantity, 0)})</span>
            </button>
          </nav>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<SevenSHomeServiceApp />);
  </script>
</body>
</html>
